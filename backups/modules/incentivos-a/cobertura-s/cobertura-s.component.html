<div style="padding: 15px;">
    <div fxLayout="column" class="card-box">
        <div class="chart-tlt"><span>Equipo de Asesores</span></div>
        <div fxFill fxLayout="row wrap" fxLayoutGap="10px" style="padding: 10px;">
            <ng-container *ngFor="let item of chartOptions; let i = index">
                <div style="height: 200px;width: 180px;padding: 0px 0px 10px 0px;" >
                    <div fxFill class="chart-item" fxLayout="column">
                        <div class="h" fxLayoutAlign="start center" fxLayoutGap="5px">
                            <div (click)="showSec(i)" fxLayout="row" fxLayoutGap="5px">
                                <div>
                                    <span class="material-icons-round">account_circle</span>
                                </div>
                                <div>
                                    <span>{{item.name}}</span>
                                </div>
                            </div>
                            <div fxFlex fxLayoutAlign="end center">
                                <button mat-raised-button class="b" (click)="showCliDetail()">
                                    <span class="material-icons i">turned_in_not</span>
                                </button>
                            </div>
                        </div>
                        <div fxFlex>
                            <div style="float: left;position: relative;width: 100%;height: 100%;">
                                <highcharts-chart 
                                    style="width: 100%;height: 100%;min-height: 80px;position:absolute;"
                                    [Highcharts]="Highcharts" [options]="item.options">
                                    <!--style="width:100%;height: 100%;min-height: 200px;position:absolute;display: inline;"-->
                                </highcharts-chart>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
