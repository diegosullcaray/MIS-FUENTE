<div fxLayout="row" style="height: 100%;">
    <mat-card fxFlex class="dina-comp" fxLayout="column">
        <div fxLayout="row" fxLayoutAlign="center center">
            <div class="dina-cab-tag">
                <span>02 Dinamizadores</span>
            </div>
        </div>
        <div class="dina-cuer">
            <div style="width: 19px;padding-left: 2px;padding-top: 16px;">
                <button mat-raised-button color="primary" class="dina-bloq-bot" (click)="eventLeft()">
                    <span class="material-icons" style="font-size: 12px;">
                        arrow_back_ios
                    </span>
                </button>
            </div>
            <div fxFlex fxLayout="row" fxLayoutGap="19px">
                <div fxFlex="50" style="height: 100%;" fxLayout="column">
                    <div fxLayoutAlign="center center" class="dina-bloq-cab">
                        <span>{{chart1.title}}</span>
                    </div>
                    <div fxLayoutAlign="center center" style="float: left;position: relative;width: 100%;height: 100%;">
                        <highcharts-chart *ngIf="!loading" style="width:100%;max-height: 193px;height: 151px;position:absolute;display: inline;" 
                        [Highcharts]="Highcharts" [options]="chart1.options"></highcharts-chart>
                    </div>
                </div>
                <div fxFlex="50" style="height: 100%;" fxLayout="column">
                    <div fxLayoutAlign="center center" class="dina-bloq-cab">
                        <span>{{chart2.title}}</span>
                    </div>
                    <div fxLayoutAlign="center center" style="float: left;position: relative;width: 100%;height: 100%;">
                        <highcharts-chart *ngIf="!loading" style="width:100%;max-height: 193px;height: 151px;position:absolute;display: inline;" 
                        [Highcharts]="Highcharts" [options]="chart2.options" ></highcharts-chart>
                    </div>
                </div>
            </div>
            <div style="width: 19px;padding-left: 2px;padding-top: 16px">
                <button mat-raised-button color="primary" class="dina-bloq-bot" (click)="eventRight()">
                    <span class="material-icons" style="font-size: 12px;">
                        arrow_forward_ios
                    </span>
                </button>
            </div>
        </div>
    </mat-card>
</div>
