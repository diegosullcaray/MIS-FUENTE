 
<div fxFill fxLayout="column"  [formGroup]="itemForm"> 
  <div fxFlex fxLayout="column" class="stg-window">
     <stg-window-bar title="Agregar" barIcon="note_add" titleAlign="start" closable=true
         (onClose)="navMain()">
     </stg-window-bar> 
     <ng-scrollbar track="all">
         <div fxFlex fxLayout="column" style="padding: 10px;" fxLayoutGap="10px">
            <div style="height: 100%;" class="mat-tab-fill-height">
                <div style="height: 100%;padding: 10px;"> 
                    <div fxLayout="row wrap" fxLayout.lt-sm="column">
                       
                         <div fxFlex="50" class="pr-16">
                            <mat-form-field class="full-width" >
                                <input matInput name="dni" type="text" onKeyPress="if(this.value.length==8) return false;" placeholder="DNI" formControlName="RNUMDOC"  required maxlength="8" minlength="8"  >
                                 
                              </mat-form-field>
                        </div>

                        <div fxFlex="50" class="pr-16">
                         <mat-form-field class="full-width" >
                             <mat-label>Tipo Documento</mat-label> 
                             <mat-select formControlName="RTIPDOC"   required >
                                 <ng-container >
                                     <mat-option  *ngFor="let item of esgService.TipoDocumento" [value]="item.cod">{{item.des}}</mat-option>
                                 </ng-container>
                             </mat-select> 
                         </mat-form-field>
                       </div>
                       <div fxFlex="50" class="pr-16">
                         <mat-form-field class="full-width" >
                            <mat-label>País</mat-label> 
                             <mat-select formControlName="RPAIS"   required >
                                 <ng-container >
                                     <mat-option  *ngFor="let item of esgService.pais" [value]="item.cod">{{item.des}}</mat-option>
                                 </ng-container>
                             </mat-select>  
                         </mat-form-field>
                       </div>

                       <div fxFlex="50" class="pr-16">
                         <mat-form-field class="full-width" >
                             <mat-label>Canal</mat-label> 
                             <mat-select formControlName="RCODCAN"   required >
                                 <ng-container >
                                     <mat-option  *ngFor="let item of esgService.canal" [value]="item.cod" (onSelectionChange)="selectCat($event)">{{item.des}}</mat-option>
                                 </ng-container>
                             </mat-select> 
                         </mat-form-field>
                       </div>
                       <div fxFlex="50" class="pr-16" *ngIf="canal==2">
                         <mat-form-field class="full-width" >
                             <mat-label>Asesor</mat-label> 
                             <mat-select formControlName="RCODSECD"   required >
                                 <ng-container >
                                     <mat-option  *ngFor="let item of esgService.asesor" [value]="item.cod">{{item.des}}</mat-option>
                                 </ng-container>
                             </mat-select> 
                         </mat-form-field>
                       </div>
                       <div fxFlex="50" class="pr-16" *ngIf="canal==1">
                         <mat-form-field class="full-width" >
                             <mat-label>Agencia</mat-label> 
                             <mat-select formControlName="RSBSUC"   required >
                                 <ng-container >
                                     <mat-option  *ngFor="let item of esgService.agencia" [value]="item.cod">{{item.des}}</mat-option>
                                 </ng-container>
                             </mat-select> 
                         </mat-form-field>
                       </div>


                        <div fxFlex="50" class="pr-16">
                            <mat-form-field class="full-width" >
                              <input matInput name="RFININI"  type="date" maxlength="128" placeholder="Fecha Inicio" formControlName="RFININI" required>
                               
                            </mat-form-field>
                          </div>

                          <div fxFlex="50" class="pr-16">
                           <mat-form-field class="full-width" >
                             <input matInput name="RFECFIN"  type="date" maxlength="128" placeholder="Fecha Fin" formControlName="RFECFIN"  >
                              
                           </mat-form-field>
                         </div>
                         <div fxFlex="100" class="pr-16">
                            <mat-form-field class="full-width" >
                              <textarea matInput name="RCOMEN"  type="text" maxlength="128" placeholder="Comentario" rows="15" cols="70" formControlName="RCOMEN"  >
                              </textarea>
                               
                            </mat-form-field>
                          </div>
                         
                        
                         
                        
                    </div>
                </div>
            </div>
             <!-- <mat-tab-group style="height: 100%;" class="mat-tab-fill-height">
                 <mat-tab>
                     <ng-template mat-tab-label>
                         <span>Asignación</span>
                     </ng-template>
                     <ng-template matTabContent>
                         
                     </ng-template>
                 </mat-tab>
                  
             </mat-tab-group>  -->
          
         </div>
     </ng-scrollbar>
     <!-- <div [@bottomAlert]="alertState" [fxHide]="alertHide">
         Por favor, ingrese todos los campos
     </div> -->
     <div [@bottomAlert]="alertState" [fxHide]="alertHide" style="background: red;color: #ffffff;">
        <div class="alert-box" [ngClass]="{'alert-warn':resultState=='warn'}" style="color: white;">
            {{respuesta}}
        </div>
    </div>
 </div>
 <div *ngIf="addMode" fxLayoutAlign="end center" style="padding: 10px 0px;">
     <stg-button color="primary" (click)="submitForm()">Guardar</stg-button>
 </div>  
</div>
