<div fxFill fxLayout="column"  [formGroup]="itemForm"> 
  <div fxFlex fxLayout="column" class="stg-window">
     <stg-window-bar [title]="title" barIcon="edit_note" titleAlign="start" closable=true
         (onClose)="navMain()">
     </stg-window-bar> 
     <ng-scrollbar track="all">
         <div fxFlex fxLayout="column" style="padding: 10px;" fxLayoutGap="10px">
            <div style="height: 100%;" class="mat-tab-fill-height">
                <div style="height: 100%;padding: 10px;"> 
                             <div fxLayout="row wrap" fxLayout.lt-sm="column">
                              <div fxFlex="50" class="pr-16">
                                <mat-form-field class="full-width" >
                                    <input matInput name="dni" type="text" onKeyPress="if(this.value.length==8) return false;" placeholder="DNI" formControlName="RNUMDOC" [readonly] = true>
                                    <mat-error *ngIf="itemForm.get('RNUMDOC').hasError('required')">
                                        Ingrese el DNI
                                      </mat-error>  
                                  </mat-form-field>
                              </div>
                              <div fxFlex="50" class="pr-16">
                                <mat-form-field class="full-width" >
                                    <input matInput name="dni" type="text" onKeyPress="if(this.value.length==5) return false;" placeholder="Tipo Documento" formControlName="RDTIPDOC" [readonly] = true>
                                    <mat-error *ngIf="itemForm.get('RDTIPDOC').hasError('required')">
                                        Ingrese el Tipo Documento
                                      </mat-error>  
                                  </mat-form-field>
                              </div>
                              <div fxFlex="50" class="pr-16">
                                <mat-form-field class="full-width" >
                                    <input matInput name="dni" type="text" onKeyPress="if(this.value.length==5) return false;" placeholder="País" formControlName="RDPAIS" [readonly] = true>
                                    <mat-error *ngIf="itemForm.get('RDPAIS').hasError('required')">
                                        Ingrese el Pais
                                      </mat-error>  
                                  </mat-form-field>
                              </div>
                              <div fxFlex="50" class="pr-16">
                                <mat-form-field class="full-width" >
                                    <input matInput name="dni" type="date"  placeholder="Fecha Inicio" formControlName="RFININI" [readonly] = true>
                                    <mat-error *ngIf="itemForm.get('RFININI').hasError('required')">
                                        Ingrese Fecha Inicio
                                      </mat-error>  
                                  </mat-form-field>
                              </div> 
                              <div fxFlex="50" class="pr-16">
                                <mat-form-field class="full-width" >
                                    <input matInput name="dni" type="date"  placeholder="Fecha Fin" formControlName="RFECFIN" [readonly] = true>
                                    <mat-error *ngIf="itemForm.get('RFECFIN').hasError('required')">
                                        Ingrese Fecha Fin
                                      </mat-error>  
                                  </mat-form-field>
                              </div> 
                              <div fxFlex="50" class="pr-16">
                                <mat-form-field class="full-width" >
                                    <mat-label>Canal</mat-label> 

                                    <mat-select formControlName="RCODCAN"  [(value)]="esgService.selectedRow.RCODCAN"  >
                                        <ng-container >
                                            <mat-option  *ngFor="let item of esgService.canal" [value]="item.cod" (onSelectionChange)="selectCat($event)">{{item.des}}</mat-option>
                                        </ng-container>
                                    </mat-select>
                                    <mat-error *ngIf="itemForm.get('RCODCAN').hasError('required')">
                                      Ingrese el Canal
                                    </mat-error> 
                                </mat-form-field>
                              </div>
                              <div fxFlex="50" class="pr-16" *ngIf="canal==1">
                                <mat-form-field class="full-width" >
                                    <mat-label>Agencia</mat-label> 

                                    <mat-select formControlName="RSBSUC"  [(value)]="esgService.selectedRow.RSBSUC">
                                        <ng-container >
                                            <mat-option  *ngFor="let item of esgService.agencia" [value]="item.cod">{{item.des}}</mat-option>
                                        </ng-container>
                                    </mat-select>
                                    <mat-error *ngIf="itemForm.get('RSBSUC').hasError('required')">
                                      Ingrese el Canal
                                    </mat-error> 
                                </mat-form-field>
                              </div>
                              <div fxFlex="50" class="pr-16" *ngIf="canal==2">
                                <mat-form-field class="full-width" >
                                    <mat-label>Asesor Final</mat-label> 

                                    <mat-select formControlName="RCODSECD"  [(value)]="esgService.selectedRow.RCODSECD">
                                        <ng-container >
                                            <mat-option  *ngFor="let item of esgService.asesor" [value]="item.cod">{{item.des}}</mat-option>
                                        </ng-container>
                                    </mat-select>
                                    <mat-error *ngIf="itemForm.get('RCODSECD').hasError('required')">
                                      Ingrese el Asesor
                                    </mat-error> 
                                </mat-form-field>
                              </div>
                             

                           
                                 
                             </div>
                         </div>
            </div>
             <!-- <mat-tab-group style="height: 100%;" class="mat-tab-fill-height">
                 <mat-tab>
                     <ng-template mat-tab-label>
                         <span>Analistas</span>
                     </ng-template>
                     <ng-template matTabContent>
                         
                     </ng-template>
                 </mat-tab> 
             </mat-tab-group>  -->
              
         </div>
     </ng-scrollbar>
     <div [@bottomAlert]="alertState" [fxHide]="alertHide">
         hola mundo
     </div>
 </div>
 <div *ngIf="editMode" fxLayoutAlign="end center" style="padding: 10px 0px;">
     <stg-button color="primary" (click)="submitForm()">Guardar</stg-button>
 </div>  
</div>
