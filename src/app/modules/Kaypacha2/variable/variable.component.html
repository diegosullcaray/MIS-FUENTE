<div fxLayout="row" class="punt-comp"> 
    <div>
        <mat-card class="pos-card2" fxLayout="column" fxLayoutAlign="center center" style="
        width: 150px;
    ">
            <span style="font-weight:700;">Puntaje Final</span>
            <span style="font-size: 16px; font-weight: bold;">{{config.puntFinal}}</span>
        </mat-card>
    </div>
    <div fxFlex fxLayout="column">  
        <div  fxFlex="50"><span style="display: flex;
            justify-content: center;
            align-items: center;
            text-align: center; margin-top: 40px;">=</span></div>  
    </div>
    <div class="container"  id="style-2" fxLayoutAlign="left center"  >
    <div *ngFor="let col of config.cabvar; let i = index"  fxFlex fxLayout="column">  
        <mat-card class="pos-card" fxLayout="column" fxLayoutAlign="center center">
            
            <span style="font-weight:600; font-size: 12px;">{{setHeader(col, i)}}</span>
            
              <span *ngFor="let item of config.datavar; index as i"  style="font-size: 12px; font-weight: bold;">{{setData(item[col], col)}}</span>
        </mat-card>
