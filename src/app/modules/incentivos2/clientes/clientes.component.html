<div fxFill fxLayout="column" class="base">
    <div fxFlex="8" fxlayout="row" class="text-title" fxLayoutAlign="center center" style="padding-bottom: 5px;">
        <div><span>Clientes Bancarizados</span></div>
        <div fxFlex fxLayout="row" fxLayoutAlign="end center">
            <button mat-raised-button class="stg-btn-short-d" (click)="navMain()">
                <span class="material-icons icon">home</span>
            </button>
        </div>
    </div>
    <div *ngIf="loadingDs" fxFlex fxLayoutAlign="center center">
        <span>Cargando...</span>
    </div>
    <div *ngIf="!loadingDs" fxFlex style="margin-top: 10px;overflow-y: auto;">
        <table>
            <thead>
                <tr>
                    <th class="nh">Nombre</th>
                    <th class="w">Mujer</th>
                    <th class="w">Rural</th>
                    <th class="w">Migrante</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let item of dataSource;let i = index">
                    <tr [class]="trCls(item.tf)">
                        <td class="n">{{item.nom}}</td>
                        <td style="text-align: center;"><span [class]="iconCls(item.gen)">circle</span></td>
                        <td style="text-align: center;"><span [class]="iconCls(item.rur)">circle</span></td>
                        <td style="text-align: center;"><span [class]="iconCls(item.mig)">circle</span></td>
                    </tr>
                </ng-container>
            </tbody>
            <tfoot>
                <tr>
                    <td class="fh">Parciales:</td>
                    <td style="text-align: center;">{{totSource.gen_c}}</td>
                    <td style="text-align: center;">{{totSource.rur_c}}</td>
                    <td style="text-align: center;">{{totSource.mig_c}}</td>
                </tr>
                <tr>
                    <td class="fh">Total:</td>
                    <td></td>
                    <td></td>
                    <td style="text-align: center;">{{totSource.tot_c}}</td>
                </tr>
                <tr>
                    <td class="fh">Monetización:</td>
                    <td></td>
                    <td></td>
                    <td>S/. {{totSource.tot_m}}</td>
                </tr>
            </tfoot>
        </table>
    </div>
    <div fxFlex="12" fxLayout="column" fxLayoutAlign="center start">
        <div fxLayoutGap="10px" fxLayoutAlign="start center"><span class="l">Trasladado (Si contabiliza)</span><span class="material-icons lt">square</span></div>
        <div fxLayoutGap="10px" fxLayoutAlign="start center"><span class="l">Heredado (No contabiliza)</span><span class="material-icons lh">square</span></div>
    </div>
</div>
