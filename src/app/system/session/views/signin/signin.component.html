<div class="h-full-screen signin-wrap" fxLayout="row wrap" fxLayoutAlign="center center">
  <div class="signin-container mat-elevation-z4 white" fxLayout="row wrap" fxLayout.xs="column"
    fxLayoutAlign="start stretch" fxFlex="60" fxFlex.xs="94" fxFlex.sm="80"
    [@animate]="{value:'*',params:{y:'40px',opacity:'0',delay:'100ms', duration: '400ms'}}">

    <!-- Left Side content //mat-bg-default en class-->
    <div fxLayout="column" fxLayoutAlign="center center" class="signin-header" style="background-color: steelblue;" fxFlex="40">

      <div class="" fxLayout="row wrap" fxLayoutAlign="center center">
        <img width="200px" src="assets/images/fc/logos/logo_cuadro_blanco.png" alt="">
      </div>

    </div>

    <!-- Right side content -->

    <div fxFlex="60" fxLayout="column" fxLayoutAlign="center center">

      
      <div >
        <img height="150px" src="assets/images/fc/logos/mis_text.png" alt="">
      </div>
      <!--<span class="font-weight-bold mat-color-primary" style="font-size: xx-large;">MIS</span>-->
      <div fxLayout="row wrap" fxLayoutAlign="start center" style="margin-top: 20px;">
        <button (click)="onSignin()" mat-raised-button color="primary">Iniciar Sesión</button>

      </div>

      <!-- <div fxLayout="row wrap" fxLayoutAlign="space-between center" style="margin-top: 20px">
          <span>or connect with </span>
          <div>
            icons goes here
          </div>
        </div> -->

    </div>
    <div style="height: 10px;"></div>
  </div>
</div>
