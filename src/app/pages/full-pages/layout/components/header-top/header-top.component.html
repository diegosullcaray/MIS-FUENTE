<div class="header-topnav mat-elevation-z2">
  <div class="container">
    <div class="topnav">
      <!-- Sidebar header: brand/title, aligned to the sidebar's width when a module is open -->
      <div class="topbar-branding" [ngStyle]="{width: moduleSidenav.active ? '300px' : 'auto'}">
        <button class="btn-start-adj btn-start-mob" mat-icon-button (click)="toggleSidenav()"
          *ngIf="layoutConf.isMobile">
          <img style="width: 36px;height: 24px;" src="assets/images/fc/logos/mis_white.png" alt="" class="app-logo">
        </button>
        <button mat-icon-button id="schemeToggle" [style.overflow]="'visible'" matTooltip="Inicio"
          [matMenuTriggerFor]="startMenu" class="btn-start-adj" *ngIf="!layoutConf.isMobile">
          <img style="width: 36px;height: 24px;" src="assets/images/fc/logos/mis_white.png" alt="" class="app-logo">
          Inicio
        </button>
      </div>

      <!-- Module sidenav toggle (reportes/actividades/corresponsales/presupuesto): sits right at the border between the sidebar header and the layout header -->
      <div style="padding-left: 5px;" *ngIf="moduleSidenav.active">
        <button mat-icon-button class="module-sidenav-toggle-btn" matTooltip="Mostrar/ocultar menú" (click)="moduleSidenav.toggle()">
          <mat-icon>{{ moduleSidenav.isOpen ? 'chevron_left' : 'chevron_right' }}</mat-icon>
        </button>
      </div>

      <!-- Desktop/home icon: left side, right after the sidebar toggle -->
      <div style="padding-left: 5px;padding-top: 5px;" *ngIf="!isDesktopHome">
        <button mat-icon-button matTooltip="Ir al inicio" (click)="showDesktop()">
          <mat-icon>desktop_windows</mat-icon>
        </button>
      </div>

      <span fxFlex></span>

      <!-- Notification toggle button -->
      <span *ngIf="user.isDev && !layout.isMobile" style="font-weight:500;">[{{user.email}}]</span>
      <button mat-icon-button matTooltip="Notifications" (click)="toggleNotific()" [style.overflow]="'visible'"
        class="topbar-button-right">
        <mat-icon>notifications</mat-icon>
        <!--<span class="notification-number mat-bg-warn">3</span>-->
      </button>
      <!-- Top right user menu -->
      <button *ngIf="!layoutConf.isMobile" mat-icon-button [matMenuTriggerFor]="accountMenu" class="topbar-button-right mr-16 img-button">
        <img *ngIf="!user.isAlt" src="{{user.pictureURL}}" alt="" referrerpolicy="no-referrer">
        <mat-icon class="material-icons-outlined" *ngIf="user.isAlt">supervised_user_circle</mat-icon>
      </button>
      <ng-container *ngIf="layoutConf.isMobile">
        <button mat-icon-button [matMenuTriggerFor]="accountMenu" class="topbar-button-right mr-16 img-button">
          <img *ngIf="!user.isAlt" src="{{user.pictureURL}}" alt="" referrerpolicy="no-referrer">
          <mat-icon class="material-icons-outlined" *ngIf="user.isAlt">supervised_user_circle</mat-icon>
        </button>
      </ng-container>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item disabled class="account-menu-username">
          <mat-icon>account_circle</mat-icon>
          <span>{{user.name}}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="confirmLogout()" class="account-menu-logout">

            logout

        </button>
