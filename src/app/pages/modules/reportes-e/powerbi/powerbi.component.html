<div fxFill class="base" fxLayout="column">
    <!-- <iframe title="dash bi" width="1140" height="541.25"
        src="https://app.powerbi.com/reportEmbed?reportId=cfb44e4f-58c9-4c02-81f2-5834b7208c19&autoAuth=true&ctid=0245b94c-fba8-4dd8-8555-6c1f231959a4"
        frameborder="0" allowFullScreen="true"></iframe> -->
    <div style="height: 10px;"></div>
    <div fxFlex style="padding: 10px;">
        <div class="stg-window">
            <stg-window-bar [title]="reportTitle"></stg-window-bar>
            <stg-toolbar>
                <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
                    <button mat-button class="stg-btn-short" (click)="backToList()">
                        <span class="material-icons-outlined icon">arrow_circle_left</span>
                    </button>
                </div>
            </stg-toolbar>
            <div class="stg-panel">
                <div style="padding: 0px 10px;">
                    <ng-container *ngIf="loading">
                        <div fxLayoutAlign="center center">
                            <spa>Cargando...</spa>
                        </div>
                    </ng-container>
                    <ng-container *ngIf="!loading">
                        <powerbi-report [embedConfig]="reportConfig" [cssClassName]="reportClass"></powerbi-report>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
    <div style="height: 10px;"></div>
</div>
