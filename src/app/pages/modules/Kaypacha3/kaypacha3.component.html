  <div   style="	background:#f1f1f1;   min-height: 100%;background-color: #fff; "     >
<div class="kp-row" style="	background:#f1f1f1" >
    <div class="kp-row kp-flex-1">
    <div class="kp-flex-100">
        <div class="kp-row-wrap">
            <div class="kp-flex-50 kp-align-start-center" style="color: rgba(0,0,0,.54);font-size: 12px;">
                <img src="assets/images/fc/modules/kaypacha/logo.png" style="width: inherit;max-height: 150px; height: 100%;">
            </div>
            <div class="kp-flex-10" style="margin-top: 20px;" >
                <button *ngIf="boton"  mat-button   class="bus-bot" (click)="openSearch()">
                    <span class="material-icons" style="font-size: 36px;">
                        switch_account
                    </span>
                </button>
            </div>

             <div class="kp-flex-40 kp-align-end-center"  style="color: rgba(0,0,0,.54);font-size: 12px;">
                    <img src="assets/images/fc/modules/kaypacha/logofc10-sinfondo2.png" style="width: 100%;margin-top: 2rem;max-height: 170px;">
             </div>
        </div>
    </div>
</div>
</div>
<div class="kp-row" >
    <div class="kp-row kp-flex-1" >
        <div class="kp-flex-100"  >
            <div class="kp-row-wrap" style="height: 70px;">
                <div class="kp-flex-7 kp-align-start-center" style="height: 70px" >
                    <div  class="kp-flex-1" style="padding-left: 15px;font-weight: bold;padding-top: 10px; "><span  style="border-radius: 5px;border: 2px solid rgb(3, 80, 150); background-color:rgb(3, 80, 150); color: #ffffff; padding: 4px; font-size: 17px;" >ASESOR:</span>   </div>
                </div>
                <div class="kp-flex-43 kp-align-start-center" style="height: 70px;font-weight: bold;padding-top: 10px;" >
                    <div style="border-radius: 5px;border: 2px solid rgb(3, 80, 150);   color: black; font-size: 17px; padding: 4px; margin-left: 5px; width: 50%;">{{nombreUsuario}} </div>
                </div>
                <div *ngIf="posicion <= '20'"   class="kp-flex-15 kp-align-center-center"  style="color: rgba(0,0,0,.54);font-size: 12px;">
                    <img  src="assets/images/fc/modules/kaypacha/PlataformaMIS2.png" style="width: 100%;margin-top: 1rem;max-height: 180px;">
                </div>
                <div *ngIf="posicion > '20'"   class="kp-flex-15 kp-align-center-center"  style="color: rgba(0,0,0,.54);font-size: 12px;">
                    <img  src="assets/images/fc/modules/kaypacha/PlataformaMIS1.png" style="width: 100%;margin-top: 1rem;max-height: 180px;">
                </div>
                <div class="kp-flex-35 kp-align-end-center" style="margin-top: 10px;">
                    <mat-card class="pos-card2 kp-col-align-center-center" style="background: #efb810;width: 210px;margin-left: 15px;height: 110px;" >
                        <span style="font-weight:700;font-size: 16px;" >Puntaje Promedio Final</span>
                        <span style="font-size: 28px; font-weight: bold;">{{puntajeFinal}}</span>
                    </mat-card>
                    <mat-card class="pos-card kp-col-align-center-center" style="width: 210px;margin-left: 18px;height: 110px;">
                        <span style="font-weight:700;font-size: 16px;">Posición</span>
                        <span style="font-size: 28px; font-weight: bold;">{{posicion}}</span>
                    </mat-card>
                </div>

            </div>

        </div>
    </div>

</div>
<div class="kp-row" >
    <div class="kp-row kp-flex-1" >
        <div class="kp-flex-100"  >
            <div class="kp-row-wrap">
                <div class="kp-flex-7 kp-align-start-center">
                    <div class="kp-flex-1" style="padding-left: 15px;font-weight: bold;padding-top: 2px; margin-top: 2px; "><span style="border-radius: 5px;border: 2px solid rgb(3, 80, 150); background-color:rgb(3, 80, 150); color: #ffffff; padding: 4px; font-size: 17px;">CARGO:   </span> </div>
                </div>
                <div class="kp-flex-43 kp-align-start-center" style="height: 70px;font-weight: bold;padding-top: 10px;" >
                    <div style="border-radius: 5px;border: 2px solid rgb(3, 80, 150);   color: black; font-size: 17px; padding: 4px;  margin-left: 5px; width: 50%;">{{cargo}}</div>
                </div>
            </div>
        </div>

    </div>
</div>


           <div style="height: 10%;   padding-top: 20px; margin-top: 20px;"   >
                <stg-window-bar title="Puntos Acumulados" titleAlign="start" fontSize="20px" style="background: rgb(3, 80, 150);color: white;font-size: 20px;flex-direction: row;box-sizing: border-box;display: flex;place-content: center flex-start;align-items: center;margin-left: 18px;margin-right: 18px;border-radius: 25px 20px 0px 0px;border-top-right-radius: 5px;border-top-left-radius: 5px;border-bottom: 1px solid #e9e9ef; "></stg-window-bar>
                <div style="height: 200px;min-width: 100%;width: 100%;flex-direction: row;box-sizing: border-box;display: flex;">
                    <div class="kp-flex-1 kp-table-row" style="height: 200px;"  >
                        <div style="padding: 10px;" class="kp-table-col conten">

                        <stg-table2 [options]="options" [dataSource]="dataSources"
                                    [headers]="headers" [optionsObserver]="optObs"   >
                        </stg-table2>

                        </div>
                        <div style="padding: 10px;" class="kp-table-col conten" >

                            <stg-table2 [options]="options" [dataSource]="dataSources"
                                        [headers]="headers1_1" [optionsObserver]="optObs"   >
                            </stg-table2>

                        </div>
                    </div>
                </div>


            </div>

            <!--NO  <div style="height: 30%; background: #fff; padding-top: 1px;"   > -->


     <div style="height: 10%;   padding-top: 20px; margin-top: 20px;"   >
    <stg-window-bar title="Variables Históricas" titleAlign="start" fontSize="20px" class="stgwindows" style="background: rgb(3, 80, 150);color: white;font-size: 20px;flex-direction: row; display: flex; align-items: center;margin-left: 18px;margin-right: 18px;border-top-right-radius: 5px;border-top-left-radius: 5px; border-bottom: 0px !important;"  ></stg-window-bar>
    <div style="height: 215px;min-width: 100%;width: 100%;flex-direction: row;box-sizing: border-box;display: flex; border-bottom: 0px !important;">

        <div class="kp-flex-1 kp-table-row" style="height: 210px;"   >
            <div style="padding: 10px;" class="kp-table-col conten">

            <stg-table2 [options]="options" [dataSource]="dataSources2"
                        [headers]="headers2" [optionsObserver]="optObs">
            </stg-table2>

            </div>
            <div style="padding: 10px;" class="kp-table-col conten">

                <stg-table2 [options]="options" [dataSource]="dataSources2"
                            [headers]="headers2_2" [optionsObserver]="optObs">
                </stg-table2>

                </div>
        </div>
    </div>


</div>

</div>
