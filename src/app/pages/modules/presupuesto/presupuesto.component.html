<div fxLayout="column" fxFill>
    <div fxFlex style="overflow-y: auto;height: 100%;">
        <mat-sidenav-container style="height: 100%;">
            <mat-sidenav fxLayout="column" [style]="calcWidth()" mode="side" [(opened)]="layout.isMobile?openExplorerMob:openExplorerDesk" >
                <app-module-switcher currentModuleCod="A_MOD_PRES"></app-module-switcher>
                <div fxLayout="column" fxFlex style="overflow-y: auto;min-height: 0;">
                    <div class="sidenav-section-title">Líneas</div>
                    <stg-basic-tree-sidenav [menuItems]="menuItems" (onSelectMenuItem)="selectSec($event)"></stg-basic-tree-sidenav>
                    <ng-container *ngIf="activeGes">
                        <div class="sidenav-section-title">Gestión</div>
                        <stg-basic-tree-sidenav [menuItems]="menuItems2" (onSelectMenuItem)="selectSec($event)"></stg-basic-tree-sidenav>
                    </ng-container>
                </div>

            </mat-sidenav>

            <mat-sidenav-content>
                <div fxLayout="column" >
                    <router-outlet></router-outlet>
                </div>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </div>
</div>
