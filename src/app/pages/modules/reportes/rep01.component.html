<div fxLayout="column" fxFill>
    <div fxFlex style="overflow-y: auto;height: 100%;">

        <mat-sidenav-container style="height: 100%;">
            <mat-sidenav fxLayout="column" [style]="calcWidth()" mode="side" [opened]="layout.isMobile ? openExplorerMob : openExplorerDesk" (openedChange)="layout.isMobile ? (openExplorerMob = $event) : (openExplorerDesk = $event)">
                <!--(closed)="msg('close!')" (opened)="msg('open!')"-->
                <app-module-switcher currentModuleCod="A_MOD_RCOM"></app-module-switcher>
                <mod-rep-sidenav fxFlex style="overflow-y: auto;min-height: 0;" [menuItems]="menuItems" (onSelectMenuItem)="hideExplorer($event)"></mod-rep-sidenav>
            </mat-sidenav>

            <mat-sidenav-content>
                <router-outlet></router-outlet>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </div>
</div>
