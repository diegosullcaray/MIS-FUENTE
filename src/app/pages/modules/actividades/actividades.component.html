<div fxLayout="column" fxFill>
    <div fxFlex style="overflow-y: auto;height: 100%;">
        <mat-sidenav-container style="height: 100%;">
            <mat-sidenav [style]="calcWidth()" mode="side"
                [(opened)]="layout.isMobile?openExplorerMob:openExplorerDesk">
                <app-module-switcher currentModuleCod="A_MOD_TAR"></app-module-switcher>
                <stg-basic-tree-sidenav [menuItems]="menuItems" (onSelectMenuItem)="selectSec($event)">
                </stg-basic-tree-sidenav>
            </mat-sidenav>
            <mat-sidenav-content>
                <div fxLayout="column">
                    <router-outlet></router-outlet>
                </div>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </div>
</div>
